name: Build CSS

# Compiles assets/sass -> assets/css so GitHub Pages serves current styles.
# Only source paths trigger this, so the commit it pushes back does not
# retrigger the workflow.
on:
  push:
    paths:
      - 'assets/sass/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/build-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit built assets
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css assets/js assets/webfonts
          if git diff --staged --quiet; then
            echo 'No changes to built assets.'
          else
            git commit -m 'Rebuild compiled assets'
            git push
          fi
